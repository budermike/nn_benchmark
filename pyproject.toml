[project]
name = "neural_network_benchmarking"
authors = [
  { name="Mike Buder", email="buder.mike@gmail.com" },
]
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "Benchmark of a small neural network (MLP with backpropagation and SGD) implemented in NumPy, PyTorch and C++."
# Relative path to the README.md file
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# Relative path to the license file
license.file = "LICENSE"

[tool.setuptools.dynamic.dependencies]
# Relative path to the dependencies file
file = ["requirements.txt"]

[tool.setuptools.dynamic.optional-dependencies.testing]
# Relative path to the dependencies file for testing
file = ["tests/requirements.txt"]

[tool.setuptools.dynamic.optional-dependencies.docs]
# Relative path to the dependencies file for documentation
file = ["docs/requirements.txt"]

# This is needed to fetch the version from git
[tool.setuptools_scm]

[build-system]
requires = ["setuptools>=64.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

